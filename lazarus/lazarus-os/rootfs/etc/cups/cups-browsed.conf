# Arcology Lazarus OS printer discovery policy.
#
# Create local queues for IPP Everywhere and AirPrint devices announced on
# the local network. Remote queues shared by another CUPS server are excluded;
# administrators can still add those explicitly from the Lazarus printer page.

BrowseRemoteProtocols dnssd
CreateRemoteCUPSPrinterQueues No
CreateIPPPrinterQueues Driverless
IPPPrinterQueueType PPD
LocalQueueNamingIPPPrinter DNS-SD
DNSSDBasedDeviceURIs Yes
AutoClustering No
KeepGeneratedQueuesOnShutdown No
DebugLogging file
