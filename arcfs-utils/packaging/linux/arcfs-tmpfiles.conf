# Ensures /run/arcfs (arcfs-linux's cross-process mount lock directory -- see
# acquire_source_lock()/ensure_shared_dir() in apps/arcfs-linux/main.cpp) exists with the right
# permissions from boot, regardless of whether the first-ever mount on a given boot happens as
# root (udisks2/pkexec) or as a plain user (a direct, unprivileged `arcfs-linux mount`, now the
# common case once the ArcFS-specific udev group grant is installed). Without this, /run itself
# being root:root 0755 means a plain user's mkdir("/run/arcfs") fails outright the first time --
# not a crash (the lock is designed to fail open), but it silently loses duplicate-mount
# protection for exactly the scenario this project's own field incident was caused by.
#
# 1777 (sticky bit), not 0755: both root-privileged and unprivileged mounts need to create/open
# lock files here, matching /tmp's own security model -- see ensure_shared_dir()'s own comment.
d /run/arcfs 1777 root root -
d /run/arcfs/locks 1777 root root -
